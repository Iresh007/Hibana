name: Firebase Test Lab

# Runs the debug APK on Firebase Test Lab (Robo crawler) in project hibana-965b8.
# Manual trigger only, so it never fails other pushes while the secret is unset.
# One-time setup: add a GitHub secret GCP_SA_KEY holding a service-account JSON key
# with the "Firebase Test Lab Admin" role (and Storage access to the results bucket).

on:
  workflow_dispatch:

jobs:
  test-lab:
    name: Robo test on Firebase Test Lab
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.5'

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.14.5

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Run Robo test
        run: |
          gcloud firebase test android run \
            --project hibana-965b8 \
            --type robo \
            --app app/build/outputs/apk/debug/app-debug.apk \
            --device model=Pixel2,version=30,locale=en,orientation=portrait \
            --timeout 5m 2>&1 | tee testlab.txt

      - name: Upload Test Lab output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-lab-output
          path: testlab.txt
          if-no-files-found: warn
