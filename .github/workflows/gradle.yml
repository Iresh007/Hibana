name: build

# Replaces GitHub's default "Java CI with Gradle" starter. That starter used
# JDK 11 and `./gradlew build`, which fails here because the binary
# gradle-wrapper.jar is intentionally not vendored. This version uses JDK 17 and
# invokes Gradle directly (provided by gradle/actions/setup-gradle), so it needs
# no wrapper jar.

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.11.1'

      # Regenerate the wrapper so a local ./gradlew works for anyone who clones,
      # then build via `gradle` directly so CI does not depend on the wrapper jar.
      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.11.1

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
