name: Build & Test

# Verification workflow for every change. Kept separate from release.yml so a
# failing PR never blocks tagging, and a release never silently skips checks.
#
# Gradle is invoked directly rather than through ./gradlew because the binary
# gradle-wrapper.jar is intentionally not vendored in this repo.

on:
  push:
    branches: [ '**' ]
  pull_request:
  workflow_dispatch:

concurrency:
  # A newer push supersedes an in-flight run for the same ref.
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test App
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.5'

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.14.5

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      # Lint errors fail the job; warnings do not (see the lint block in
      # app/build.gradle.kts). Swallowing the exit code here meant genuine
      # defects were reported as annotations on a green build and went
      # unnoticed. The report is uploaded either way.
      - name: Lint
        run: gradle :app:lintDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-reports
          path: |
            app/build/reports/**
          if-no-files-found: ignore
