name: Release

# Tag-driven release: push a v* tag (or run manually) and this produces a
# signed-if-possible APK attached to a GitHub Release.
#
# Split into three jobs so a failure is attributable at a glance — the tag, the
# build, or publishing — rather than hiding inside one long job.

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. v0.2.0'
        required: true

permissions:
  contents: write   # required to create the release

jobs:
  extract-tag:
    name: Extract tag name
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Resolve tag
        id: tag
        run: |
          # Tag pushes carry the ref; manual runs pass it as an input.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.version }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG"

  build:
    name: Build
    needs: extract-tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.11.1'

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.11.1

      # Fail early and explicitly. A release that quietly ships unsigned produces
      # an APK users cannot install as an update, and the cause is not obvious
      # from the artifact itself.
      - name: Verify signing secrets are present
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: |
          missing=""
          [ -z "$KEYSTORE_B64" ]   && missing="$missing SIGNING_KEYSTORE"
          [ -z "$KEY_ALIAS" ]      && missing="$missing SIGNING_KEY_ALIAS"
          [ -z "$KEY_PASSWORD" ]   && missing="$missing SIGNING_KEY_PASSWORD"
          [ -z "$STORE_PASSWORD" ] && missing="$missing SIGNING_STORE_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            echo "Add them under Settings > Secrets and variables > Actions." >&2
            exit 1
          fi

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE }}
        run: |
          # Written outside the workspace so it can never be picked up by an
          # artifact upload or left behind in the checkout.
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/hibana-release.jks"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/hibana-release.jks" >> "$GITHUB_ENV"

      # Gradle signs during assembleRelease using the signingConfig, so the APK
      # is zipaligned and v1/v2/v3-signed in one step. versionName follows the
      # tag so the installed app reports what was shipped.
      - name: Build signed release APK
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: |
          gradle :app:assembleRelease --stacktrace \
            -PversionName=${{ needs.extract-tag.outputs.version }}

      - name: Verify the APK is signed
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          # Proves the artifact is actually signed rather than merely built.
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK"
          mv "$APK" "app/build/outputs/apk/release/hibana-${{ needs.extract-tag.outputs.tag }}.apk"

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/hibana-release.jks"

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: release-apk
          path: app/build/outputs/apk/release/hibana-*.apk
          if-no-files-found: error

  publish:
    name: Create GitHub Release
    needs: [ extract-tag, build ]
    runs-on: ubuntu-latest
    steps:
      - name: Download APK
        uses: actions/download-artifact@v8
        with:
          name: release-apk
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.extract-tag.outputs.tag }}
          name: Hibana ${{ needs.extract-tag.outputs.tag }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(needs.extract-tag.outputs.tag, '-') }}
          files: artifacts/*.apk
          # Without this the release publishes even if the glob matched nothing,
          # producing a Release with no APK attached and no failure to notice.
          fail_on_unmatched_files: true
