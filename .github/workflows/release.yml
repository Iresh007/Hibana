name: Release

# Tag-driven release: push a v* tag (or run manually) and this produces a
# signed-if-possible APK attached to a GitHub Release.
#
# Split into three jobs so a failure is attributable at a glance — the tag, the
# build, or publishing — rather than hiding inside one long job.

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. v0.2.0'
        required: true

permissions:
  contents: write   # required to create the release

jobs:
  extract-tag:
    name: Extract tag name
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Resolve tag
        id: tag
        run: |
          # Tag pushes carry the ref; manual runs pass it as an input.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.version }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG"

  build:
    name: Build
    needs: extract-tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.11.1'

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.11.1

      # versionName follows the tag so the installed app reports what was shipped.
      - name: Build release APK
        run: |
          gradle :app:assembleRelease --stacktrace \
            -PversionName=${{ needs.extract-tag.outputs.version }}

      # Signing only runs when the secrets exist, so forks and first-time runs
      # still produce an (unsigned) artifact instead of failing outright.
      - name: Sign APK
        id: sign
        if: ${{ env.KEYSTORE_B64 != '' }}
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/keystore.jks"
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          UNSIGNED=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          "$BUILD_TOOLS/zipalign" -p -f 4 "$UNSIGNED" app/build/outputs/apk/release/hibana-aligned.apk
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/keystore.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$STORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "app/build/outputs/apk/release/hibana-${{ needs.extract-tag.outputs.tag }}.apk" \
            app/build/outputs/apk/release/hibana-aligned.apk
          rm -f "$RUNNER_TEMP/keystore.jks" app/build/outputs/apk/release/hibana-aligned.apk

      - name: Name unsigned APK
        if: ${{ env.KEYSTORE_B64 == '' }}
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE }}
        run: |
          UNSIGNED=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          cp "$UNSIGNED" "app/build/outputs/apk/release/hibana-${{ needs.extract-tag.outputs.tag }}-unsigned.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: release-apk
          path: app/build/outputs/apk/release/hibana-*.apk
          if-no-files-found: error

  publish:
    name: Create GitHub Release
    needs: [ extract-tag, build ]
    runs-on: ubuntu-latest
    steps:
      - name: Download APK
        uses: actions/download-artifact@v6
        with:
          name: release-apk
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.extract-tag.outputs.tag }}
          name: Hibana ${{ needs.extract-tag.outputs.tag }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(needs.extract-tag.outputs.tag, '-') }}
          files: artifacts/*.apk
