name: Android emulator test

# Builds the debug APK, installs it on a headless cloud emulator, runs a
# 60 second monkey stress test and uploads logcat.txt / crashes.txt.

on:
  push:
    branches: [ '**' ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: emulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator-test:
    name: Build APK and run on emulator
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.5'

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.14.5

      # The release build ships ARM only; the cloud emulator is x86_64, so this
      # run adds that ABI (-PincludeX86=true) to keep ML Kit's native libs loadable.
      - name: Build debug APK
        run: gradle :app:assembleDebug -PincludeX86=true --stacktrace

      # Hardware acceleration for the emulator needs /dev/kvm access on the runner.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run app on emulator (monkey stress test)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash .github/scripts/emulator-test.sh

      - name: Upload emulator logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: emulator-logs
          path: |
            logcat.txt
            crashes.txt
            emulator-logs/**
            app/build/reports/**
          if-no-files-found: warn
