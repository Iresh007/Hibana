name: Android CI (disabled - superseded by gradle.yml)

# Superseded by .github/workflows/gradle.yml. Kept manual-only to avoid running
# a duplicate build on every push. Safe to delete this file.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.11.1'

      # Invoke Gradle directly (provided by setup-gradle) so the build does not
      # depend on a committed gradle-wrapper.jar. Also (re)generate the wrapper
      # so ./gradlew works for anyone who checks the repo out afterwards.
      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.11.1

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Run lint
        run: gradle :app:lintDebug --stacktrace || true

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
