[versions]
# Toolchain is pinned to what IReader extensions are built against (Kotlin 2.2.21,
# ktor 3.3.2, serialization 1.9.0) so their published source-api artifact and the
# extension dex resolve against matching Kotlin metadata.
agp = "8.9.1"
kotlin = "2.2.21"
ksp = "2.2.21-2.0.5"
# Pulled to 1.17.0 transitively by the IReader/ktor stack; 1.17 mandates
# compileSdk 36 and AGP 8.9.1+, which is why both are pinned above.
coreKtx = "1.17.0"
lifecycle = "2.8.7"
activityCompose = "1.9.3"
composeBom = "2024.12.01"
navigationCompose = "2.8.5"
room = "2.7.1"
datastore = "1.1.1"
okhttp = "4.12.0"
jsoup = "1.18.1"
serialization = "1.9.0"
coroutines = "1.9.0"
coil = "2.7.0"
preference = "1.2.1"
ireader = "1.5.1"
ktor = "3.3.2"
ksoup = "0.2.6"
kotlinxDatetime = "0.7.1"
rhino = "1.7.15"

[libraries]
androidx-preference = { group = "androidx.preference", name = "preference-ktx", version.ref = "preference" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-service = { group = "androidx.lifecycle", name = "lifecycle-service", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
jsoup = { group = "org.jsoup", name = "jsoup", version.ref = "jsoup" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-serialization-protobuf = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-protobuf", version.ref = "serialization" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlin-reflect = { group = "org.jetbrains.kotlin", name = "kotlin-reflect", version.ref = "kotlin" }
coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }

# IReader extension runtime. The real published source-api is used rather than a
# hand-written shim so extension classes resolve against the exact ABI they were
# compiled against. ktor + ksoup are the transitive APIs extensions call directly.
ireader-source-api = { group = "io.github.ireaderorg", name = "source-api", version.ref = "ireader" }
ktor-client-core = { group = "io.ktor", name = "ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { group = "io.ktor", name = "ktor-client-okhttp", version.ref = "ktor" }
ktor-client-content-negotiation = { group = "io.ktor", name = "ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-json = { group = "io.ktor", name = "ktor-serialization-kotlinx-json", version.ref = "ktor" }
ksoup = { group = "io.github.ireaderorg", name = "ksoup", version.ref = "ksoup" }
ksoup-network = { group = "io.github.ireaderorg", name = "ksoup-network", version.ref = "ksoup" }
kotlinx-datetime = { group = "org.jetbrains.kotlinx", name = "kotlinx-datetime", version.ref = "kotlinxDatetime" }
# Rhino runs LNReader's JS plugins. They compile to ES5, so a pure-JVM engine
# works and avoids QuickJS's NDK/ABI-split cost. Must run interpreted on Android.
rhino = { group = "org.mozilla", name = "rhino", version.ref = "rhino" }

# On-device OCR so text-to-speech can read *manga* pages, which are images.
# Script-specific models are separate artifacts; CJK matters for this app.
mlkit-text-latin = { group = "com.google.mlkit", name = "text-recognition", version = "16.0.1" }
mlkit-text-japanese = { group = "com.google.mlkit", name = "text-recognition-japanese", version = "16.0.1" }
mlkit-text-korean = { group = "com.google.mlkit", name = "text-recognition-korean", version = "16.0.1" }
mlkit-text-chinese = { group = "com.google.mlkit", name = "text-recognition-chinese", version = "16.0.1" }
# On-device translation. Language packs download at runtime (~30MB each), so
# this adds little to the APK unlike the bundled OCR models.
mlkit-translate = { group = "com.google.mlkit", name = "translate", version = "17.0.3" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
